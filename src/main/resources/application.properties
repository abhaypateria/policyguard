# =============================================================================
#  PolicyGuard configuration. Secrets are NEVER written here: locally they come
#  from a gitignored .env file, in production from the host's secret store.
# =============================================================================
spring.application.name=policyguard
# 8081 locally (Oracle's TNS listener holds 8080 on the dev machine); hosts set PORT.
server.port=${PORT:8081}
spring.config.import=optional:file:.env[.properties]

# ---- Database: Neon Postgres + pgvector (same database type in dev and prod) ----
# Either set DATABASE_URL (Neon's postgresql://user:pass@host/db format) or the three DB_* values.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Flyway owns the schema (versioned SQL in db/migration); Hibernate never alters tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---- Spring AI: local ONNX embedding model (all-MiniLM-L6-v2 -> 384-dimension vectors) ----
spring.ai.model.embedding=transformers
# The tokenizer ships inside the spring-ai-transformers jar; the ONNX model (~90 MB) is downloaded once
# and cached (the Docker image bakes it in, so cloud cold-starts never download it).
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
spring.ai.embedding.transformer.onnx.model-uri=${ONNX_MODEL_URI:https://github.com/spring-projects/spring-ai/raw/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx}
spring.ai.embedding.transformer.tokenizer.options[maxLength]=256
spring.ai.embedding.transformer.tokenizer.options[truncation]=true
spring.ai.embedding.transformer.tokenizer.options[padding]=true
spring.ai.embedding.transformer.cache.directory=${ONNX_CACHE_DIR:${java.io.tmpdir}/policyguard-onnx}

# ---- Spring AI: pgvector store (table + indexes are created by Flyway V1) ----
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.table-name=vector_store

# ---- Retrieval ----
# top-k: chunks given to the LLM. candidate-k: chunks fetched per retriever before fusion.
policyguard.retrieval.top-k=6
policyguard.retrieval.candidate-k=15
# hybrid = dense (pgvector) + sparse (Postgres full-text) fused with Reciprocal Rank Fusion
policyguard.retrieval.hybrid=true
# Calibrated abstention threshold: below this best-chunk similarity we refuse.
# Tuned on the evaluation set (see docs/EVALUATION.md, threshold sweep).
policyguard.retrieval.min-similarity=${MIN_SIMILARITY:0.30}

# ---- Self-correction loop: 1 initial attempt + up to 2 rewrite-and-retry attempts ----
policyguard.rag.max-attempts=3

# ---- Chunking (all-MiniLM reads at most 256 word-pieces, so chunks stay under that) ----
policyguard.chunking.size-tokens=200
policyguard.chunking.min-chunk-chars=150

# ---- LLM failover chain: tried in order; a provider without a key is skipped ----
policyguard.llm.connect-timeout-seconds=5
policyguard.llm.read-timeout-seconds=90
policyguard.llm.providers[0].name=groq
policyguard.llm.providers[0].base-url=https://api.groq.com/openai
policyguard.llm.providers[0].api-key=${GROQ_API_KEY:}
policyguard.llm.providers[0].model=${GROQ_MODEL:llama-3.3-70b-versatile}
policyguard.llm.providers[1].name=gemini
policyguard.llm.providers[1].base-url=https://generativelanguage.googleapis.com/v1beta/openai
policyguard.llm.providers[1].completions-path=/chat/completions
policyguard.llm.providers[1].api-key=${GEMINI_API_KEY:}
policyguard.llm.providers[1].model=${GEMINI_MODEL:gemini-2.5-flash}
policyguard.llm.providers[2].name=ollama
policyguard.llm.providers[2].base-url=${OLLAMA_BASE_URL:http://localhost:11434}
policyguard.llm.providers[2].api-key=ollama
policyguard.llm.providers[2].model=${OLLAMA_MODEL:qwen2.5:7b}
policyguard.llm.providers[2].enabled=${OLLAMA_ENABLED:true}

# ---- Production guards ----
# If ADMIN_KEY is set, uploads/deletes/eval runs require the X-Admin-Key header.
policyguard.security.admin-key=${ADMIN_KEY:}
policyguard.security.chat-requests-per-minute=${CHAT_RPM:20}
policyguard.security.chat-requests-per-day=${CHAT_RPD:1000}
policyguard.security.cors-allowed-origins=${CORS_ORIGINS:*}

# Exact-match answer cache (protects LLM quota during demos); invalidated on any re-index.
policyguard.cache.enabled=true
policyguard.cache.ttl-minutes=30

# Seed the bundled corpus (RBI directions + fictional Demo Bank SOPs) into an empty database.
policyguard.seed.enabled=${SEED_CORPUS:true}
policyguard.eval.enabled=${EVAL_ENABLED:true}
policyguard.eval.output-file=docs/EVALUATION.md

# ---- Application ----
spring.application.name=policyguard
server.port=8080

# ---- Database connection (JDBC) ----
# Host port 5433 (mapped to the container's 5432) to avoid clashing with any
# local PostgreSQL already using 5432 on this machine.
spring.datasource.url=jdbc:postgresql://localhost:5433/policyguard
spring.datasource.username=policyguard
spring.datasource.password=policyguard
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update: let Hibernate create/update tables from our entities automatically.
# Fine for local dev; we have no entities yet, so this does nothing today.
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs, so we can see what's happening while learning.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
